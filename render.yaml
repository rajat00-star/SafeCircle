# Render Blueprint: one Docker web service + managed PostgreSQL.
# Deploy: Render dashboard -> New -> Blueprint -> select this repository.
services:
  - type: web
    name: safecircle-guardian
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: SAFECIRCLE_ENV
        value: production
      - key: SAFECIRCLE_SECRET_KEY
        generateValue: true
      - key: SAFECIRCLE_DATABASE_URL
        fromDatabase: { name: safecircle-db, property: connectionString }
      - key: SAFECIRCLE_TRUST_PROXY_HEADERS
        value: "true"
databases:
  - name: safecircle-db
    plan: free
